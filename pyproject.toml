[project]
name = "cardio-ml-predictor"
version = "0.2.0"
description = "Comparing machine learning classifiers for cardiovascular disease prediction from routine health metrics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.1.0",
    "jinja2>=3.1.6",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "shap>=0.52.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cardio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
